[project]
name = "peer2peer-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20",
  "fastapi>=0.142",
  "psycopg[binary]>=3.3",
  "pydantic-settings>=2.15",
  "sqlalchemy>=2.1",
  "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "mypy>=2.3",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--tb=short"]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["^alembic/"]
